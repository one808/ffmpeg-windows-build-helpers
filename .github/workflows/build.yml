name: Build FFmpeg XP

on:
  # push trigger disabled 2026-10-26: xp-build.yml now owns CI for xp-core2.
  # This podman-based pipeline stays available for manual runs as a fallback.
  # push:
  #   branches: [xp-core2]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (32 or 64)'
        default: '32'
        type: string
      tier:
        description: 'CPU tier (e.g. core2, pentium3, nehalem)'
        default: 'core2'
        type: string
      cflags:
        description: 'Custom CFLAGS (leave empty for tier defaults)'
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo apt-get clean
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check environment
        run: |
          echo "--- podman ---"
          podman --version || echo "PODMAN NOT FOUND"
          echo "--- bash version ---"
          bash --version | head -1
          echo "--- scripts/build.sh ---"
          ls -la scripts/build.sh
          file scripts/build.sh
          echo "--- repo root ---"
          ls -la

      - name: Build FFmpeg
        id: build
        run: |
          ARCH="${{ inputs.arch || '32' }}"
          TIER="${{ inputs.tier || 'core2' }}"
          CFLAGS="${{ inputs.cflags }}"

          ARGS="--arch=$ARCH --tier=$TIER --cpus $(nproc)"
          if [[ -n "$CFLAGS" ]]; then
            ARGS="$ARGS --cflags='$CFLAGS'"
          fi

          echo "Starting build: arch=$ARCH tier=$TIER cpus=$(nproc)"
          echo "::group::Podman build + FFmpeg compile"
          # shellcheck disable=SC2086
          bash scripts/build.sh $ARGS
          EXIT_CODE=$?
          echo "::endgroup::"
          echo "build.sh exited with code $EXIT_CODE"
          exit $EXIT_CODE

      - name: Diagnose build failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          TIER="${{ inputs.tier || 'core2' }}"
          CONTAINER="ffmpeg-xp-${TIER}"
          echo "::group::Diagnosing fontconfig/pkg-config issue"
          # Write a diagnostic script into the bind-mounted repo dir (/work in the
          # container) so we avoid nested-quote hell, then run it inside the container.
          cat > fontconfig_diag.sh <<'DIAGEOF'
          #!/usr/bin/env bash
          set +e
          PREFIX="/work/ffmpeg_local_builds/sandbox/cross_compilers/mingw-w64-i686/i686-w64-mingw32"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR=
          CROSS="$PREFIX/bin/i686-w64-mingw32-"
          echo "=== fontconfig.pc ==="; cat "$PREFIX/lib/pkgconfig/fontconfig.pc" 2>/dev/null || echo NOTFOUND
          echo "=== libxml-2.0.pc ==="; cat "$PREFIX/lib/pkgconfig/libxml-2.0.pc" 2>/dev/null || echo NOTFOUND
          echo "=== freetype2.pc ==="; cat "$PREFIX/lib/pkgconfig/freetype2.pc" 2>/dev/null || echo NOTFOUND
          echo "=== pkg-config --static --cflags --libs fontconfig ==="
          pkg-config --static --cflags --libs fontconfig; echo "exit=$?"
          echo "=== pkg-config --static --print-requires fontconfig ==="
          pkg-config --static --print-requires fontconfig; echo "exit=$?"
          echo "=== pkg-config --static --print-requires-private fontconfig ==="
          pkg-config --static --print-requires-private fontconfig; echo "exit=$?"
          echo "=== manual link test (mimic require_pkg_config FcInit) ==="
          printf '#include <fontconfig/fontconfig.h>\nint main(void){ FcInit(); return 0; }\n' > /tmp/fc_probe.c
          ${CROSS}gcc -c /tmp/fc_probe.c -o /tmp/fc_probe.o $(pkg-config --static --cflags fontconfig) 2>&1; echo "compile exit=$?"
          ${CROSS}gcc /tmp/fc_probe.o -o /tmp/fc_probe.exe $(pkg-config --static --libs fontconfig) -lssp 2>&1; echo "link exit=$?"
          echo "=== FFmpeg ffbuild/config.log (fontconfig section) ==="
          FLOG=$(find /work/ffmpeg_local_builds -path '*FFmpeg_git/ffbuild/config.log' 2>/dev/null | head -1)
          if [[ -n "$FLOG" ]]; then grep -in -A6 -B2 'fontconfig\|FcInit\|undefined reference' "$FLOG" | head -120; else echo 'config.log not found'; fi
          echo "=== which libs exist in prefix/lib ==="
          ls "$PREFIX/lib"/lib{fontconfig,freetype,xml2,lzma,z,iconv,pthread,ws2_32}* 2>/dev/null
          DIAGEOF
          if podman container exists "$CONTAINER" 2>/dev/null; then
            echo "--- Container exists, inspecting ---"
            podman start "$CONTAINER" 2>/dev/null || true
            podman exec "$CONTAINER" bash /work/fontconfig_diag.sh 2>&1
          else
            echo "Container $CONTAINER does not exist."
          fi
          echo "::endgroup::"

      - name: Check XP compatibility
        if: success()
        run: |
          TIER="${{ inputs.tier || 'core2' }}"
          ARCH="${{ inputs.arch || '32' }}"
          echo "::group::XP compat audit"
          bash scripts/check-xp-compat.sh --target="win${ARCH}-${TIER}"
          echo "::endgroup::"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-winxp-${{ inputs.tier || 'core2' }}-${{ inputs.arch || '32' }}bit
          path: redist/
          retention-days: 30
          if-no-files-found: warn
