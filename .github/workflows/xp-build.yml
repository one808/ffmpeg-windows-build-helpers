# Build Windows-XP-compatible FFmpeg on GitHub Actions (native Linux runner,
# no container), then statically audit the result for XP safety.
#
# One job = one complete build (cross GCC toolchain + ~63 pinned deps + FFmpeg),
# which takes roughly an hour on a 4-core runner. The build is resumable at the
# dependency level (finished deps leave touchfiles under
# ffmpeg_local_builds/sandbox/, which is preserved in a rolling actions/cache),
# so if the time budget below is ever exhausted or a step fails, re-running
# this workflow continues where it left off instead of starting over.
#
# Trigger with Run workflow. Inputs:
#   cpu             CPU tier from scripts/build-matrix.sh's MATRIX table. This
#                   also picks the bitness: pentium3 = pre-SSE2, pentium4 = SSE2
#                   generic baseline, pentium-m/athlon64 = SSE2, core2 = SSSE3
#                   (default), amdfam10/nehalem = SSE4, *-64 = XP x64 targets.
#   linkage         static = self-contained exes (default), shared = exes +
#                   FFmpeg core DLLs (av*/sw*/postproc*) + a '-dev' package
#   build_minutes   build time budget before handing over to the next run
#                   (default 300; the build itself typically needs ~60)
name: FFmpeg XP build

run-name: "FFmpeg XP build · ${{ inputs.cpu }} · ${{ inputs.linkage }}"

on:
  workflow_dispatch:
    inputs:
      cpu:
        type: choice
        description: "CPU tier (also picks bitness) -- see scripts/build-matrix.sh"
        options:
          - core2
          - pentium3
          - pentium4
          - pentium-m
          - athlon64
          - amdfam10
          - nehalem
          - athlon64-64
          - sandybridge-64
        default: "core2"
      linkage:
        description: "static = self-contained exes; shared = exes + FFmpeg core DLLs (av*/sw*/postproc*) + dev package"
        default: "static"
      build_minutes:
        description: "Build time budget in minutes (state is cached; re-running resumes)"
        default: "300"

permissions:
  contents: read

concurrency:
  group: xp-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "build · ${{ inputs.cpu }} · ${{ inputs.linkage }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 355 # hard job ceiling (GitHub max 360) > build_minutes + setup
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/hostedtoolcache 2>/dev/null || true
          df -h /

      # NOTE: deliberately NO CC/CXX override here. cross_compile_ffmpeg.sh's
      # mingw-w64-build-r33 step needs CC unset so the mingw-w64 CRT/headers
      # configure picks i686-w64-mingw32-gcc itself; a host CC leaking in makes
      # the CRT build silently use the host compiler and produce a broken sysroot
      # ("checking for _mingw_mac.h... no", later "cannot find dllcrt2.o").
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            p7zip-full autoconf autogen automake bison bzip2 cmake cvs ed flex git gperf \
            libtool libtool-bin make texinfo patch pax pkg-config subversion unzip wget \
            xz-utils yasm mercurial meson ninja-build nasm gettext autopoint curl ca-certificates \
            gcc-12 g++-12
          # gcc-12/g++-12 installed (not exported as CC) purely to match the Debian 12
          # toolchain this fork is tested with; r33 picks its host compiler itself.
          gcc --version | head -1

      # Split restore/save (instead of actions/cache@v4) so the sandbox is saved
      # even when the build step fails -- otherwise a failed run loses its state
      # and the next run starts from zero.
      - name: Restore build sandbox (rolling cache)
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ffmpeg_local_builds/sandbox
            redist
          key: sandbox-${{ github.run_id }}
          restore-keys: |
            sandbox-

      - name: "Build (resumable, time-boxed ${{ inputs.build_minutes }}m)"
        run: |
          set -uo pipefail
          mkdir -p logs
          TIER="${{ inputs.cpu }}"
          LINKAGE="${{ inputs.linkage }}"
          # Single source of truth for tier:arch:cflags is the MATRIX table in
          # scripts/build-matrix.sh -- read the entry instead of duplicating it.
          ARCH=$(sed -n "s/^  \"$TIER:\([0-9]*\):[^\"]*\".*$/\1/p" scripts/build-matrix.sh | head -1)
          CFLAGS=$(sed -n "s/^  \"$TIER:[0-9]*:\([^\"]*\)\".*$/\1/p" scripts/build-matrix.sh | head -1)
          if [[ -z "$ARCH" || -z "$CFLAGS" ]]; then
            echo "::error::cpu tier '$TIER' not found in scripts/build-matrix.sh"; exit 1
          fi
          # Same label derivation as cross_compile_ffmpeg.sh (from -march=) -- it names
          # the build subdir (win<arch>-<label>) and the release packages.
          LABEL=$(grep -oE -- '-march=[A-Za-z0-9_-]+' <<<"$CFLAGS" | head -1 | sed 's/^-march=//')
          LABEL="${LABEL:-generic}"
          case "$LINKAGE" in
            static) STATIC_FLAG=y ;;
            shared) STATIC_FLAG=n ;;
            *) echo "::error::linkage must be 'static' or 'shared' (got '$LINKAGE')"; exit 1 ;;
          esac
          # Completion = the FFmpeg package for *this* tier+linkage exists (deps like
          # libfdk-aac/frei0r also drop their own .7z packages into redist/, and a
          # package from another tier/linkage says nothing about this build).
          if [[ -f ffmpeg_local_builds/sandbox/.build-complete-$LABEL-$ARCH-$LINKAGE ]] || compgen -G "redist/*/ffmpeg-*-$LINKAGE-winxp-$LABEL-${ARCH}bit.7z" >/dev/null; then
            echo "Build already complete ($TIER/$LINKAGE) - nothing to do."; exit 0
          fi
          echo "== building --arch=$ARCH --tier=$TIER --cflags='$CFLAGS' --linkage=$LINKAGE, budget ${{ inputs.build_minutes }}m =="
          timeout --signal=TERM --kill-after=90 "${{ inputs.build_minutes }}m" \
            bash -c "cd ffmpeg_local_builds && ./cross_compile_ffmpeg.sh -d --sandbox-ok=y --arch=$ARCH --build-ffmpeg-static=$STATIC_FLAG --cflags='$CFLAGS'" \
            2>&1 | tee "logs/build-$TIER-$LINKAGE.log"
          status=${PIPESTATUS[0]}
          if [[ $status -eq 0 ]]; then
            touch ffmpeg_local_builds/sandbox/.build-complete-$LABEL-$ARCH-$LINKAGE
            echo "== build completed =="
          elif [[ $status -eq 124 ]]; then
            echo "::error::time budget exhausted -- build state is saved in cache; re-run this workflow (same inputs) to resume where it left off"
            exit 1
          else
            echo "::error::build failed (exit $status)"
            exit "$status"
          fi

      - name: Save build sandbox (even on failure)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ffmpeg_local_builds/sandbox
            redist
          key: sandbox-${{ github.run_id }}

      # Everything FFmpeg's configure needs us to see when a dep check dies with
      # "not found using pkg-config": that error also covers a failed compile/link
      # *test*, so reproduce FFmpeg's exact check (check_func_headers) by hand.
      - name: Diagnose failure (config.log + pkg-config + manual link test)
        if: failure()
        run: |
          set +e -u  # diagnostics must never fail the step themselves
          TIER="${{ inputs.cpu }}"
          LINKAGE="${{ inputs.linkage }}"
          ARCH=$(sed -n "s/^  \"$TIER:\([0-9]*\):[^\"]*\".*$/\1/p" scripts/build-matrix.sh | head -1)
          CFLAGS=$(sed -n "s/^  \"$TIER:[0-9]*:\([^\"]*\)\".*$/\1/p" scripts/build-matrix.sh | head -1)
          LABEL=$(grep -oE -- '-march=[A-Za-z0-9_-]+' <<<"$CFLAGS" | head -1 | sed 's/^-march=//')
          LABEL="${LABEL:-generic}"
          PREFIX="ffmpeg_local_builds/sandbox/cross_compilers/mingw-w64-i686/i686-w64-mingw32"
          CROSS="ffmpeg_local_builds/sandbox/cross_compilers/mingw-w64-i686/bin/i686-w64-mingw32-gcc"
          FFMPEG_DIR="ffmpeg_local_builds/sandbox/win$ARCH-$LABEL/FFmpeg_git"
          echo "===== ffbuild/config.log tail (the exact failed command + error) ====="
          tail -n 80 "$FFMPEG_DIR/ffbuild/config.log" 2>/dev/null || echo "(no config.log)"
          echo
          echo "===== .pc files in the static closure of fontconfig ====="
          for p in fontconfig freetype2 libxml-2.0 zlib liblzma libiconv; do
            echo "--- $p.pc ---"
            cat "$PREFIX/lib/pkgconfig/$p.pc" 2>/dev/null || echo "(missing)"
          done
          echo
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR=
          echo "===== pkg-config --static --cflags fontconfig ====="
          pkg-config --static --cflags fontconfig 2>&1 || true
          echo "===== pkg-config --static --libs fontconfig ====="
          pkg-config --static --libs fontconfig 2>&1 || true
          echo
          echo "===== manual reproduction of FFmpeg's fontconfig check ====="
          if [[ -x "$CROSS" ]]; then
            cat > t_fcprobe.c <<'EOF'
          #include <fontconfig/fontconfig.h>
          #include <stdint.h>
          int main(void){ void *p = (void*)(intptr_t)FcInit; (void)p; return 0; }
          EOF
            sed -i 's/^          //' t_fcprobe.c
            FCFLAGS=$(pkg-config --static --cflags fontconfig 2>/dev/null) || true
            FCLIBS=$(pkg-config --static --libs fontconfig 2>/dev/null) || true
            echo "+ $CROSS $FCFLAGS t_fcprobe.c $FCLIBS -lssp -o t_fcprobe.exe"
            "$CROSS" $FCFLAGS t_fcprobe.c $FCLIBS -lssp -o t_fcprobe.exe 2>&1 | tail -40
            echo "(exit ${PIPESTATUS[0]})"
          else
            echo "(cross compiler not built yet)"
          fi
          echo
          echo "===== relevant libs installed in prefix ====="
          ls "$PREFIX/lib" 2>/dev/null | grep -Ei 'pthread|iconv|^libz\.|^liblzma|xml|ssp' || true

      # Same two checks scripts/check-xp-compat.sh performs (PE subsystem version
      # ceiling + Vista+-only imported symbols), minus that script's podman wrapper
      # -- the freshly built cross-objdump runs natively on the runner. Blocklist
      # regex kept in sync with scripts/check-xp-compat.sh.
      - name: XP compatibility audit (static import check)
        if: always()
        run: |
          set -uo pipefail
          TIER="${{ inputs.cpu }}"
          LINKAGE="${{ inputs.linkage }}"
          ARCH=$(sed -n "s/^  \"$TIER:\([0-9]*\):[^\"]*\".*$/\1/p" scripts/build-matrix.sh | head -1)
          CFLAGS=$(sed -n "s/^  \"$TIER:[0-9]*:\([^\"]*\)\".*$/\1/p" scripts/build-matrix.sh | head -1)
          LABEL=$(grep -oE -- '-march=[A-Za-z0-9_-]+' <<<"$CFLAGS" | head -1 | sed 's/^-march=//')
          LABEL="${LABEL:-generic}"
          if [[ "$ARCH" == "64" ]]; then
            OBJDUMP=ffmpeg_local_builds/sandbox/cross_compilers/mingw-w64-x86_64/bin/x86_64-w64-mingw32-objdump
            MAJ=5; MIN=2  # XP x64 Edition / Server 2003 = NT 5.2
            PREFIX="ffmpeg_local_builds/sandbox/cross_compilers/mingw-w64-x86_64/x86_64-w64-mingw32"
          else
            OBJDUMP=ffmpeg_local_builds/sandbox/cross_compilers/mingw-w64-i686/bin/i686-w64-mingw32-objdump
            MAJ=5; MIN=1  # real 32-bit XP = NT 5.1
            PREFIX="ffmpeg_local_builds/sandbox/cross_compilers/mingw-w64-i686/i686-w64-mingw32"
          fi
          [[ -x "$OBJDUMP" ]] || { echo "objdump not built yet (no toolchain in cache) - skipping audit"; exit 0; }
          BLOCKLIST='\<(CancelIoEx|BCryptGenRandom|BCryptOpenAlgorithmProvider|BCryptCloseAlgorithmProvider|InitOnceExecuteOnce|InitOnceBeginInitialize|InitOnceComplete|InitializeSRWLock|AcquireSRWLockExclusive|AcquireSRWLockShared|ReleaseSRWLockExclusive|ReleaseSRWLockShared|TryAcquireSRWLockExclusive|TryAcquireSRWLockShared|InitializeConditionVariable|WakeConditionVariable|WakeAllConditionVariable|SleepConditionVariableCS|SleepConditionVariableSRW|GetTickCount64|CreateSymbolicLinkA|CreateSymbolicLinkW|SetThreadDescription|GetFileInformationByHandleEx|SetFileInformationByHandle|GetLogicalProcessorInformation|GetLogicalProcessorInformationEx|K32EnumProcesses|CreateWaitableTimerExA|CreateWaitableTimerExW|GetSystemTimePreciseAsFileTime|WSAPoll|GetAddrInfoExA|GetAddrInfoExW|inet_ntop|inet_pton|WSASendMsg|GetActiveProcessorCount|GetActiveProcessorGroupCount|GetMaximumProcessorCount|GetThreadGroupAffinity|SetThreadGroupAffinity|GetNumaProcessorNodeEx|GetNumaNodeProcessorMaskEx|GetNumaHighestNodeNumberEx|CreateFile2|InitializeProcThreadAttributeList|UpdateProcThreadAttribute|IsWow64Process2|[a-zA-Z_][a-zA-Z0-9_]*_s)\>'
          # Audit every shipped PE file: the three exes plus, for shared builds,
          # FFmpeg's own core DLLs (av*/sw*/postproc*) from the install prefix.
          FDIR="ffmpeg_local_builds/sandbox/win$ARCH-$LABEL/FFmpeg_git"
          files=()
          for exe in ffmpeg.exe ffplay.exe ffprobe.exe; do
            if [[ -f "$FDIR/$exe" ]]; then files+=("$FDIR/$exe"); fi
          done
          for dll in "$PREFIX"/bin/{av,sw,postproc}*.dll; do
            if [[ -f "$dll" ]]; then files+=("$dll"); fi
          done
          if [[ ${#files[@]} -eq 0 ]]; then echo "no exes/dlls built yet - skipping audit"; exit 0; fi
          fail=0
          for f in "${files[@]}"; do
            echo "== $(basename "$f") =="
            dump=$("$OBJDUMP" -p "$f")
            major=$(grep -m1 -i MajorSubsystemVersion <<<"$dump" | awk '{print $2}')
            minor=$(grep -m1 -i MinorSubsystemVersion <<<"$dump" | awk '{print $2}')
            echo "  PE subsystem version: $major.$minor (ceiling: $MAJ.$MIN)"
            if (( major > MAJ || (major == MAJ && minor > MIN) )); then
              echo "  FAIL: subsystem version exceeds XP"; fail=1
            fi
            hits=$(grep -oE "$BLOCKLIST" <<<"$dump" | sort -u || true)
            if [[ -n "$hits" ]]; then
              echo "  FAIL: Vista+-only import(s):"; sed 's/^/    /' <<<"$hits"; fail=1
            else
              echo "  OK: no known Vista+-only imports."
            fi
          done
          exit $fail

      # Collect just the finished release folder -- redist/ accumulates stale
      # timestamped dirs from earlier runs via the cache, and dep builds (libfdk-aac,
      # frei0r) drop their own .7z packages there, so upload precisely the folder that
      # contains the finished FFmpeg package and name the artifact after it.
      - name: Collect release files
        id: collect
        if: always()
        run: |
          set -uo pipefail
          TIER="${{ inputs.cpu }}"
          LINKAGE="${{ inputs.linkage }}"
          ARCH=$(sed -n "s/^  \"$TIER:\([0-9]*\):[^\"]*\".*$/\1/p" scripts/build-matrix.sh | head -1)
          CFLAGS=$(sed -n "s/^  \"$TIER:[0-9]*:\([^\"]*\)\".*$/\1/p" scripts/build-matrix.sh | head -1)
          LABEL=$(grep -oE -- '-march=[A-Za-z0-9_-]+' <<<"$CFLAGS" | head -1 | sed 's/^-march=//')
          LABEL="${LABEL:-generic}"
          mkdir -p artifacts-out
          for d in redist/*/; do
            if compgen -G "$d*-$LINKAGE-winxp-$LABEL-${ARCH}bit.7z" >/dev/null; then
              cp -a "${d%/}"/. artifacts-out/
            fi
          done
          pkg=$(ls artifacts-out/ffmpeg-*-$LINKAGE-winxp-$LABEL-${ARCH}bit.7z 2>/dev/null | head -1) || true
          if [[ -n "$pkg" ]]; then
            echo "name=$(basename "$pkg" .7z)" >> "$GITHUB_OUTPUT"
            echo "Collected release files:"; ls -la artifacts-out/
          else
            echo "No finished FFmpeg package in this run - nothing to collect."
          fi

      # One artifact per run, named exactly like the package inside it
      # (e.g. "ffmpeg-n8.1.2-static-winxp-pentium4-32bit").
      - name: Upload release artifact
        if: always() && steps.collect.outputs.name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          overwrite: true
          path: artifacts-out/**
          retention-days: 30

      # Only when there is no finished package (i.e. a failed build) is a
      # build-logs artifact uploaded, purely for debugging.
      - name: Upload build logs (no finished package)
        if: always() && steps.collect.outputs.name == ''
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.cpu }}-${{ inputs.linkage }}
          path: logs/**
          if-no-files-found: warn
          retention-days: 14
